[obsidian]
# 옵시디언 볼트 경로 (비워두면 자동 탐색)
vault_path =

# 데일리노트 폴더명 (루트에 있으면 비워두기)
daily_folder = Daily

# 데일리노트 날짜 형식 (파일명 기준)
daily_format = %Y-%m-%d

# 자존노트.md에 표시될 날짜 형식
output_date_format = %Y.%m.%d

[notes]
# 데일리노트에서 긁어올 섹션 헤딩
source_heading = 자존노트

# 대상 노트 파일명
target_note = 자존노트.md

# 대상 노트 안의 섹션 헤딩
target_section = 하루자존

# 자동 생성될 대시보드 노트 파일명 (자존노트.md 와 같은 폴더에 생성됨)
dashboard_note = 자존 대시보드.md
