[obsidian]
# 옵시디언 볼트 경로 (비워두면 자동 탐색)
vault_path =

# 데일리노트 폴더명 (루트에 있으면 비워두기)
daily_folder = Daily

# 데일리노트 날짜 형식 (파일명 기준)
daily_format = %Y-%m-%d

# 자존노트.md에 표시될 날짜 형식
output_date_format = %Y.%m.%d

[notes]
# 데일리노트에서 긁어올 섹션 헤딩
source_heading = 자존노트

# 대상 노트 파일명
target_note = 자존노트.md

# 대상 노트 안의 섹션 헤딩
target_section = 하루자존

# 자동 생성될 대시보드 노트 파일명 (자존노트.md 와 같은 폴더에 생성됨)
dashboard_note = 자존 대시보드.md

[output]
# 데일리노트에서 긁어올 출력 섹션 헤딩
source_heading = 출력

# 출력 아카이브 노트 파일명 (없으면 자존노트.md 옆에 자동 생성)
target_note = 출력노트.md

# 아카이브 노트 안의 섹션 헤딩
target_section = 출력기록

# 자동 생성될 대시보드 노트 파일명
dashboard_note = 출력 대시보드.md

# 주간 출력 목표 (주 1회)
weekly_goal = 1

# 전역일 (남은 출력 기회 계산용)
discharge_date = 2027-07-18

[threads]
# 초안이 저장될 볼트 안 폴더명
draft_folder = 스레드 초안

# 재료로 쓸 최근 데일리노트 일수
lookback_days = 3

# 하루에 생성할 초안 개수
num_drafts = 3

# Claude Code CLI 명령 (PATH에 없으면 전체 경로 입력)
claude_command = claude

# 재료에서 제외할 섹션 (이미 발행한 것)
exclude_heading = 출력
